<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>To Be Decided</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: black;
      color: #ffffC2;
      display: flex;
      justify-content: center; /* Centers horizontally (X-axis) */
      align-items: center;     /* Centers vertically (Y-axis) */
      font-family: sans-serif;
      overflow: auto;
    }
    .layer {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }
    .flower { object-fit: cover; object-position: center; }
    .smoke { mix-blend-mode: screen; }
    #smoke-back { z-index: 1; }
    .flower-base { z-index: 2; }
    /* brightened copy of the flower, revealed only near the spotlight */
    .flower-lit {
      z-index: 3;
      filter: brightness(1.9) contrast(1.1) saturate(1.1);
      -webkit-mask-image: radial-gradient(ellipse 22% 30% at 56% 42%, #000 0%, rgba(0,0,0,.6) 45%, transparent 100%);
      mask-image: radial-gradient(ellipse 22% 30% at 56% 42%, #000 0%, rgba(0,0,0,.6) 45%, transparent 100%);
    }
    /* soft visible cone of light from the top right */
    .beam {
      z-index: 4;
      mix-blend-mode: screen;
      background: linear-gradient(to bottom left, rgba(255, 244, 220, .5), rgba(255, 244, 220, .12) 60%, transparent);
      clip-path: polygon(96% -6%, 108% 4%, 62% 62%, 50% 52%);
      filter: blur(22px);
      opacity: .55;
    }
    #smoke-front { z-index: 5; }
    .large-text {
      font-family: monospace;
      font-size: clamp(0.65rem, 2vw, 2rem);
      font-weight: bold;
      line-height: 1;
      white-space: pre;
      margin: 0;
    }
  </style>
</head>
<body>

  <canvas id="smoke-back" class="layer smoke"></canvas>
  <img class="layer flower flower-base" src="./lily.png" alt="">
  <img class="layer flower flower-lit" src="./lily.png" alt="">
  <div class="layer beam"></div>
  <canvas id="smoke-front" class="layer smoke"></canvas>
  <pre class="large-text"></pre>

  <script>
    const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
    const start = performance.now();
    let target = [-1, -1], cur = [-1, -1];
    addEventListener('pointermove', e => {
      target = [e.clientX / innerWidth, 1 - e.clientY / innerHeight];
    });

    const initSmoke = (canvas, offset, amp) => {
      const gl = canvas.getContext('webgl', { alpha: true, premultipliedAlpha: true, antialias: false });
      if (!gl) return;

      const vs = `attribute vec2 p; void main(){ gl_Position = vec4(p, 0., 1.); }`;
      const fs = `
        precision mediump float;
        uniform vec2 res;
        uniform float t;
        uniform vec2 mouse;
        uniform vec2 off;
        uniform float amp;

        float hash(vec2 p){ return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }
        float noise(vec2 p){
          vec2 i = floor(p), f = fract(p);
          f = f * f * (3. - 2. * f);
          return mix(mix(hash(i), hash(i + vec2(1, 0)), f.x),
                     mix(hash(i + vec2(0, 1)), hash(i + vec2(1, 1)), f.x), f.y);
        }
        float fbm(vec2 p){
          float v = 0., a = .5;
          mat2 r = mat2(.8, -.6, .6, .8);
          for (int i = 0; i < 5; i++){ v += a * noise(p); p = r * p * 2.02 + 7.3; a *= .5; }
          return v;
        }

        void main(){
          vec2 uv = gl_FragCoord.xy / res.y + off;
          float s = t * .05;

          // domain-warped fbm gives swirling, wispy tendrils
          vec2 q = vec2(fbm(uv * 1.6 + vec2(s, -s * .6)),
                        fbm(uv * 1.6 + vec2(-s * .8, s) + 5.2));
          vec2 r = vec2(fbm(uv * 2. + 3. * q + vec2(1.7, 9.2) + s * 1.2),
                        fbm(uv * 2. + 3. * q + vec2(8.3, 2.8) - s));
          float d = fbm(uv * 1.8 + 3.2 * r);

          // gentle push of the smoke away from the cursor
          vec2 m = mouse * res / res.y + off;
          d *= smoothstep(.0, .35, distance(uv, m)) * .5 + .5;

          float a = smoothstep(.35, .95, d) * amp;
          vec3 col = mix(vec3(.62, .66, .78), vec3(1., .96, .92), r.x);
          gl_FragColor = vec4(col * a, a);
        }`;

      const sh = (type, src) => {
        const s = gl.createShader(type);
        gl.shaderSource(s, src);
        gl.compileShader(s);
        return s;
      };
      const prog = gl.createProgram();
      gl.attachShader(prog, sh(gl.VERTEX_SHADER, vs));
      gl.attachShader(prog, sh(gl.FRAGMENT_SHADER, fs));
      gl.linkProgram(prog);
      if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) return;
      gl.useProgram(prog);

      gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
      gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
      const loc = gl.getAttribLocation(prog, 'p');
      gl.enableVertexAttribArray(loc);
      gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);

      const uRes = gl.getUniformLocation(prog, 'res');
      const uT = gl.getUniformLocation(prog, 't');
      const uMouse = gl.getUniformLocation(prog, 'mouse');
      const uOff = gl.getUniformLocation(prog, 'off');
      const uAmp = gl.getUniformLocation(prog, 'amp');

      // render at reduced resolution; smoke is soft so it stays light on the GPU
      const scale = 1.0;
      const resize = () => {
        canvas.width = Math.max(1, Math.floor(innerWidth * scale));
        canvas.height = Math.max(1, Math.floor(innerHeight * scale));
        gl.viewport(0, 0, canvas.width, canvas.height);
      };
      addEventListener('resize', resize);
      resize();

      const frame = now => {
        gl.useProgram(prog);
        gl.uniform2f(uRes, canvas.width, canvas.height);
        gl.uniform1f(uT, reduce ? 0 : (now - start) / 1000);
        gl.uniform2f(uMouse, cur[0], cur[1]);
        gl.uniform2f(uOff, offset[0], offset[1]);
        gl.uniform1f(uAmp, amp);
        gl.drawArrays(gl.TRIANGLES, 0, 3);
        if (!reduce) requestAnimationFrame(frame);
      };
      requestAnimationFrame(frame);
    };

    // shared smoothing of the cursor position, updated once per frame
    const track = () => {
      cur[0] += (target[0] - cur[0]) * .05;
      cur[1] += (target[1] - cur[1]) * .05;
      requestAnimationFrame(track);
    };
    if (!reduce) track();

    initSmoke(document.getElementById('smoke-back'), [0, 0], .08);
    initSmoke(document.getElementById('smoke-front'), [11.3, 6.7], .07);
  </script>

</body>
</html>
